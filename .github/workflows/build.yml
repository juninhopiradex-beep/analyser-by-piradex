name: Build ANALYSER by Piradex (macOS + Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testes-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes numéricos do núcleo DSP
        run: |
          g++ -O2 -std=c++17 -ISource tests/test_core.cpp -o test_core
          ./test_core

  macos:
    needs: testes-dsp
    runs-on: macos-14
    env:
      VERSAO: "2.0.0"
      ART: build/Analyser_artefacts/Release
      # Assinatura PACE do AAX (opcional): só corre quando estes segredos existirem
      PACE_ACCOUNT: ${{ secrets.PACE_ACCOUNT }}
      PACE_PASSWORD: ${{ secrets.PACE_PASSWORD }}
      PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
      PACE_EDEN_URL: ${{ secrets.PACE_EDEN_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Configurar (universal Intel + Apple Silicon, macOS 10.13+)
        run: >
          cmake -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Compilar VST3 + AU + AAX
        run: cmake --build build --config Release --target Analyser_VST3 Analyser_AU Analyser_AAX -- -quiet

      - name: Verificar arquiteturas e versão mínima do macOS
        run: |
          for b in "$ART/VST3/ANALYSER by Piradex.vst3/Contents/MacOS/ANALYSER by Piradex" \
                   "$ART/AU/ANALYSER by Piradex.component/Contents/MacOS/ANALYSER by Piradex" \
                   "$ART/AAX/ANALYSER by Piradex.aaxplugin/Contents/MacOS/ANALYSER by Piradex"; do
            echo "== $b"
            archs=$(lipo -archs "$b"); echo "arquiteturas: $archs"
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "FALTA uma arquitetura"; exit 1; }
            minos=$(otool -arch x86_64 -l "$b" | awk '/LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION/{f=1} f&&/(version|minos)/{print $2; exit}')
            echo "macOS mínimo (Intel): $minos"
            [[ "$minos" == "10.13" ]] || { echo "Versão mínima inesperada"; exit 1; }
          done

      - name: Assinar ad-hoc
        run: |
          codesign --force --deep -s - "$ART/VST3/ANALYSER by Piradex.vst3"
          codesign --force --deep -s - "$ART/AU/ANALYSER by Piradex.component"
          codesign --force --deep -s - "$ART/AAX/ANALYSER by Piradex.aaxplugin"

      - name: Validar Audio Unit (auval, Apple Silicon e Intel/Rosetta)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ART/AU/ANALYSER by Piradex.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -a | grep -i piradex || true
          auval -v aufx PxAN Prdx
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 auval -v aufx PxAN Prdx

      - name: Validar com pluginval
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          set -o pipefail
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 300000 \
            --validate "$ART/VST3/ANALYSER by Piradex.vst3" 2>&1 | tee pluginval-macOS.log

      - name: Criar instalador .pkg e .dmg
        run: |
          mkdir -p root/Library/Audio/Plug-Ins/VST3 root/Library/Audio/Plug-Ins/Components
          cp -R "$ART/VST3/ANALYSER by Piradex.vst3" root/Library/Audio/Plug-Ins/VST3/
          cp -R "$ART/AU/ANALYSER by Piradex.component" root/Library/Audio/Plug-Ins/Components/
          pkgbuild --root root --identifier com.piradex.analyser.plugins --version "$VERSAO" \
                   --install-location / --scripts installer/scripts analyser-plugins.pkg
          productbuild --distribution installer/distribution.xml --resources installer \
                       --package-path . "ANALYSER by Piradex $VERSAO.pkg"
          mkdir -p "dmg/Plugins"
          cp "ANALYSER by Piradex $VERSAO.pkg" dmg/
          cp installer/LEIA-ME.txt dmg/
          cp -R "$ART/VST3/ANALYSER by Piradex.vst3" "$ART/AU/ANALYSER by Piradex.component" dmg/Plugins/
          hdiutil create -volname "ANALYSER by Piradex" -srcfolder dmg -ov -format UDZO "ANALYSER-by-Piradex-$VERSAO-macOS.dmg"
          ls -la *.pkg *.dmg

      # AAX: o Pro Tools normal só carrega plugins assinados pela PACE (wraptool).
      # Sem credenciais, sai um .zip "nao-assinado" (serve no Pro Tools Developer).
      - name: Assinar AAX com PACE (só com credenciais nos segredos)
        if: env.PACE_ACCOUNT != '' && env.PACE_EDEN_URL != ''
        run: |
          curl -sSL -o eden.dmg "$PACE_EDEN_URL"
          hdiutil attach -nobrowse -mountpoint /Volumes/Eden eden.dmg
          sudo installer -pkg /Volumes/Eden/*.pkg -target /
          WRAP="/Applications/PACEAntiPiracy/Eden/Fusion/Current/bin/wraptool"
          "$WRAP" sign --verbose --account "$PACE_ACCOUNT" --password "$PACE_PASSWORD" --wcguid "$PACE_WCGUID" \
            --dsig1-compat off --in "$ART/AAX/ANALYSER by Piradex.aaxplugin" --out "$ART/AAX/ANALYSER by Piradex.aaxplugin"
          "$WRAP" verify --verbose --in "$ART/AAX/ANALYSER by Piradex.aaxplugin"
          touch aax-assinado

      - name: Empacotar AAX
        run: |
          mkdir -p aax
          cp -R "$ART/AAX/ANALYSER by Piradex.aaxplugin" aax/
          cp installer/LEIA-ME-AAX.txt aax/
          SUF=$([ -f aax-assinado ] && echo "assinado" || echo "nao-assinado")
          ditto -c -k --sequesterRsrc aax "ANALYSER-by-Piradex-$VERSAO-macOS-AAX-$SUF.zip"
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ANALYSER-by-Piradex-macOS
          path: |
            ANALYSER-by-Piradex-*-macOS.dmg
            ANALYSER-by-Piradex-*-macOS-AAX-*.zip
            pluginval-macOS.log


  windows:
    needs: testes-dsp
    runs-on: windows-2022
    env:
      VERSAO: "2.0.0"
      ART: build/Analyser_artefacts/Release
      PACE_ACCOUNT: ${{ secrets.PACE_ACCOUNT }}
      PACE_PASSWORD: ${{ secrets.PACE_PASSWORD }}
      PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
      PACE_EDEN_WIN_URL: ${{ secrets.PACE_EDEN_WIN_URL }}
      PACE_KEYFILE_B64: ${{ secrets.PACE_KEYFILE_B64 }}
      PACE_KEYPASSWORD: ${{ secrets.PACE_KEYPASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (x64, Visual Studio 2022)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar VST3 + AAX
        run: cmake --build build --config Release --target Analyser_VST3 Analyser_AAX --parallel 4

      - name: Verificar binário x64 e dependências
        shell: pwsh
        run: |
          $dll = "$env:ART/VST3/ANALYSER by Piradex.vst3/Contents/x86_64-win/ANALYSER by Piradex.vst3"
          if (!(Test-Path $dll)) { throw "VST3 não encontrado" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -like "*Hostx64\x64*" } | Select-Object -First 1
          & $dumpbin.FullName /headers $dll | Select-String "machine"
          $deps = & $dumpbin.FullName /dependents $dll
          $deps
          if ($deps -match "VCRUNTIME|MSVCP") { throw "Depende do VC++ Redistributable (runtime devia estar embutido)" }
          $aax = "$env:ART/AAX/ANALYSER by Piradex.aaxplugin/Contents/x64/ANALYSER by Piradex.aaxplugin"
          if (!(Test-Path $aax)) { throw "AAX não encontrado" }
          & $dumpbin.FullName /headers $aax | Select-String "machine"
          $deps = & $dumpbin.FullName /dependents $aax
          if ($deps -match "VCRUNTIME|MSVCP") { throw "AAX depende do VC++ Redistributable" }

      - name: Validar com pluginval
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          & .\pv\pluginval.exe --strictness-level 5 --timeout-ms 300000 --validate "$env:ART/VST3/ANALYSER by Piradex.vst3" 2>&1 | Tee-Object -FilePath pluginval-Windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Criar instalador (Inno Setup) e .zip
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DVersao=$env:VERSAO" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou" }
          Compress-Archive -Path "$env:ART/VST3/ANALYSER by Piradex.vst3", installer/LEIA-ME-Windows.txt -DestinationPath "out-win/ANALYSER-by-Piradex-$env:VERSAO-Windows-VST3.zip"
          Get-ChildItem out-win

      - name: Assinar AAX com PACE (só com credenciais nos segredos)
        if: env.PACE_ACCOUNT != '' && env.PACE_EDEN_WIN_URL != ''
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:PACE_EDEN_WIN_URL -OutFile eden.exe
          Start-Process -Wait -FilePath .\eden.exe -ArgumentList "/quiet"
          [IO.File]::WriteAllBytes("pace.p12", [Convert]::FromBase64String($env:PACE_KEYFILE_B64))
          $wrap = Get-ChildItem "${env:ProgramFiles(x86)}\PACEAntiPiracy" -Recurse -Filter wraptool.exe | Select-Object -First 1
          $bundle = "$env:ART/AAX/ANALYSER by Piradex.aaxplugin"
          & $wrap.FullName sign --verbose --account $env:PACE_ACCOUNT --password $env:PACE_PASSWORD --wcguid $env:PACE_WCGUID `
            --keyfile pace.p12 --keypassword $env:PACE_KEYPASSWORD --in $bundle --out $bundle
          if ($LASTEXITCODE -ne 0) { throw "wraptool falhou" }
          Remove-Item pace.p12
          New-Item aax-assinado -ItemType File | Out-Null

      - name: Empacotar AAX
        shell: pwsh
        run: |
          $suf = if (Test-Path aax-assinado) { "assinado" } else { "nao-assinado" }
          New-Item -ItemType Directory -Force out-win | Out-Null
          Compress-Archive -Path "$env:ART/AAX/ANALYSER by Piradex.aaxplugin", installer/LEIA-ME-AAX.txt -DestinationPath "out-win/ANALYSER-by-Piradex-$env:VERSAO-Windows-AAX-$suf.zip"
          Get-ChildItem out-win

      - uses: actions/upload-artifact@v4
        with:
          name: ANALYSER-by-Piradex-Windows
          path: |
            out-win/*
            pluginval-Windows.log

  publicar:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSAO: "2.0.0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar versão (macOS + Windows)
        run: |
          ls -la dist
          TAG="v$VERSAO"
          gh release delete "$TAG" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          FICHEIROS=$(find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \))
          echo "$FICHEIROS"
          gh release create "$TAG" $FICHEIROS -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "ANALYSER by Piradex $VERSAO" \
            --notes "Interface em Português e Inglês (seletor PT | EN). AAX (Pro Tools): ficheiros *-AAX-*.zip, ver LEIA-ME-AAX.txt. macOS (10.13+, Intel e Apple Silicon): ANALYSER-by-Piradex-$VERSAO-macOS.dmg · Windows 10/11 64 bits: ANALYSER-by-Piradex-$VERSAO-Windows-Setup.exe (ou o .zip para instalação manual)."

      - name: Guardar binários no ramo "builds"
        run: |
          cd dist
          git init -q -b builds
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Build $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
